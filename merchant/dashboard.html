<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家后台 - 味来点餐</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .nav-cards { display: flex; flex-direction: column; gap: 12px; }
    .nav-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform .15s;
    }
    .nav-card:hover { transform: translateY(-2px); }
    .nav-card .nc-icon {
      font-size: 36px; width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary-light); border-radius: 14px;
    }
    .nav-card .nc-info { flex: 1; }
    .nav-card .nc-info .nc-title { font-size: 17px; font-weight: 600; }
    .nav-card .nc-info .nc-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  </style>
</head>
<body>
<div class="nav-bar">
  <span class="title">商家后台</span>
</div>
<div class="page">
  <div class="stats" id="stats">
    <div class="stat-card new" onclick="location.href='orders.html?filter=new'">
      <div class="num" id="statNew">0</div>
      <div class="label">新订单</div>
    </div>
    <div class="stat-card cooking" onclick="location.href='orders.html?filter=cooking'">
      <div class="num" id="statCooking">0</div>
      <div class="label">制作中</div>
    </div>
    <div class="stat-card done" onclick="location.href='orders.html?filter=done'">
      <div class="num" id="statDone">0</div>
      <div class="label">今日完成</div>
    </div>
  </div>

  <div class="nav-cards">
    <a class="nav-card" href="orders.html">
      <div class="nc-icon">📋</div>
      <div class="nc-info">
        <div class="nc-title">订单管理</div>
        <div class="nc-desc">查看和处理所有订单</div>
      </div>
      <span>→</span>
    </a>
    <a class="nav-card" href="tables.html">
      <div class="nc-icon">🪑</div>
      <div class="nc-info">
        <div class="nc-title">桌位管理</div>
        <div class="nc-desc">查看和编辑桌位状态</div>
      </div>
      <span>→</span>
    </a>
    <a class="nav-card" href="../index.html">
      <div class="nc-icon">🏠</div>
      <div class="nc-info">
        <div class="nc-title">返回首页</div>
        <div class="nc-desc">切换到顾客端</div>
      </div>
      <span>→</span>
    </a>
  </div>
</div>

<script src="../js/data-init.js"></script>
<script src="../js/store.js"></script>
<script>
(function () {
  function updateStats() {
    const orders = Store.getOrders();
    document.getElementById('statNew').textContent = orders.filter(o => o.status === 'new').length;
    document.getElementById('statCooking').textContent = orders.filter(o => o.status === 'cooking').length;
    document.getElementById('statDone').textContent = orders.filter(o => o.status === 'done').length;
  }
  updateStats();
  // 仪表盘不需要轮询，但监听 storage 变化
  window.addEventListener('storage', updateStats);
  // 此页面可能在其他标签打开，简单定时刷新统计
  setInterval(updateStats, 5000);
})();
</script>
</body>
</html>
