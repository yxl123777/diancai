<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 味来点餐</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .order-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .order-card .oc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .order-card .oc-table {
      font-size: 19px;
      font-weight: 700;
    }
    .order-card .oc-time {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .order-card .oc-dishes {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .order-card .oc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-card .oc-price {
      font-size: 20px;
      color: var(--danger);
      font-weight: 700;
    }
    .order-card .oc-actions { display: flex; gap: 8px; }

    /* 轮询指示器 */
    .poll-indicator {
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      padding: 12px;
    }
    .poll-dot { color: var(--success); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
<div class="nav-bar">
  <a class="back" href="dashboard.html">←</a>
  <span class="title">订单管理</span>
</div>
<div class="page">
  <div class="filter-tabs" style="margin-bottom:16px;">
    <button class="filter-tab active" data-filter="all">全部</button>
    <button class="filter-tab" data-filter="new">🆕 新订单</button>
    <button class="filter-tab" data-filter="cooking">👨‍🍳 制作中</button>
    <button class="filter-tab" data-filter="done">✅ 已完成</button>
  </div>
  <div id="orderList"></div>
  <div class="poll-indicator"><span class="poll-dot">●</span> 自动刷新中（3秒）</div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/data-init.js"></script>
<script src="../js/store.js"></script>
<script>
function getFilter() {
  return new URLSearchParams(location.search).get('filter') || 'all';
}

(function () {
  let currentFilter = getFilter();

  // 初始化筛选标签
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', function () {
      currentFilter = this.dataset.filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      render();
    });
    if (tab.dataset.filter === currentFilter) {
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });

  function render() {
    let orders = Store.getOrders();
    if (currentFilter !== 'all') {
      orders = orders.filter(o => o.status === currentFilter);
    }

    const list = document.getElementById('orderList');

    if (orders.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无订单</p></div>';
      return;
    }

    list.innerHTML = orders.map(o => {
      const time = new Date(o.createdAt);
      const timeStr = time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const statusText = { new: '🆕 待处理', cooking: '👨‍🍳 制作中', done: '✅ 已完成' }[o.status];
      const statusClass = 'status-' + o.status;
      const dishText = o.items.map(i => i.name + '×' + i.qty).join('、');

      let actionsHTML = '';
      if (o.status === 'new') {
        actionsHTML = `<button class="btn btn-success btn-sm" data-order="${o.id}" data-action="accept">接单</button>`;
      } else if (o.status === 'cooking') {
        actionsHTML = `<button class="btn btn-primary btn-sm" data-order="${o.id}" data-action="complete">出餐</button>`;
      }

      return `
        <div class="order-card">
          <div class="oc-header">
            <span class="oc-table">${o.tableName} 桌</span>
            <span class="oc-time">${timeStr} · #${String(o.id).slice(-6)}</span>
          </div>
          <div class="oc-dishes">${dishText}</div>
          <div class="oc-bottom">
            <span class="oc-price">¥${o.total}</span>
            <div class="oc-actions">
              <span class="status-badge ${statusClass}">${statusText}</span>
              ${actionsHTML}
            </div>
          </div>
        </div>
      `;
    }).join('');

    // 绑定操作按钮
    list.querySelectorAll('[data-action="accept"]').forEach(btn => {
      btn.addEventListener('click', function () {
        Store.updateOrderStatus(this.dataset.order, 'cooking');
        render();
      });
    });
    list.querySelectorAll('[data-action="complete"]').forEach(btn => {
      btn.addEventListener('click', function () {
        const orderId = this.dataset.order;
        Store.updateOrderStatus(orderId, 'done');
        // 释放桌位
        const order = Store.getOrderById(orderId);
        if (order) Store.updateTableStatus(order.tableId, 'free');
        render();
      });
    });
  }

  render();
  setInterval(render, 3000);
  window.addEventListener('storage', render);
})();
</script>
</body>
</html>
